<!doctype html>
<html lang="en">
<head>
<style>
  .intro { font-size: 13px; }
  .note { font-size: 12px; }
  .mock ~ .aside { font-size: 12px; }
  .shown .task { font-size: 12px; }
  .tx-head { font-size: 12px; }
</style>
</head>
<body>
  <p class="intro">Plan the week in one place.</p>
  <div class="mock" role="img" aria-label="Board preview">
    <p class="note">Due Friday</p>
  </div>
  <p class="note">Free for teams of up to five.</p>
  <p class="aside">Works offline.</p>
  <div class="shown" aria-hidden="false"><p class="task">Draft release notes</p></div>
  <ul><li class="tx-head" aria-hidden="true"><span>Description</span><span>Amount</span></li></ul>
</body>
</html>
